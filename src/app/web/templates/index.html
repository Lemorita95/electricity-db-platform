<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>electricity_db</title>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist@2.27.0/plotly.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --border: #2a2a2a;
    --text: #e8e8e8;
    --muted: #666;
    --input-bg: #141414;
    --c-price: #5DCAA5;
    --c-demand: #85B7EB;
    --c-weather: #C49EE0;
  }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem;
  }

  header {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 2rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1.5rem;
  }

  header h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1.1rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    color: var(--c-price);
  }

  header span {
    font-size: 0.8rem;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }

  .spacer {
    flex: 1;
  }

  .rate-status {
    display: flex;
    align-items: center;
    gap: 1.25rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
  }

  .rate-item {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .rate-label {
    color: var(--muted);
  }

  .rate-value {
    color: var(--text);
    min-width: 2rem;
    text-align: right;
  }

  .controls {
    display: grid;
    grid-template-columns: 180px 1fr 1fr auto;
    gap: 1rem;
    align-items: end;
    margin-bottom: 2rem;
    background: var(--surface);
    padding: 1.25rem;
    border: 1px solid var(--border);
    border-radius: 4px;
  }

  .field label {
    display: block;
    font-size: 0.7rem;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  .field select,
  .field input[type="datetime-local"] {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.5rem 0.75rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    border-radius: 3px;
    outline: none;
    appearance: none;
  }

  .field select:focus,
  .field input:focus {
    border-color: var(--c-price);
  }

  .field select option {
    background: var(--surface);
  }

  .btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 0.5rem 1rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    border-radius: 3px;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .btn:hover {
    border-color: var(--c-price);
    color: var(--c-price);
  }

  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .btn.running {
    border-color: var(--c-demand);
    color: var(--c-demand);
  }

  .btn-fetch {
    background: var(--c-price);
    color: #0a2a1f;
    border: none;
    font-weight: 500;
  }

  .btn-fetch:hover {
    opacity: 0.85;
    color: #0a2a1f;
    border-color: transparent;
  }

  .error-msg {
    display: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    color: #E24B4A;
    margin-bottom: 1rem;
    padding: 0.75rem 1rem;
    border: 1px solid #3a1a1a;
    border-radius: 3px;
    background: #1a0f0f;
  }

  .charts {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1.25rem;
  }

  .chart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
    gap: 1rem;
  }

  .chart-header-left {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .chart-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .chart-unit {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
  }

  .chart-container {
    height: 280px;
  }

  .status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    text-align: center;
    padding: 4rem 0;
  }

  .weather-select {
    background: var(--input-bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.3rem 0.6rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    border-radius: 3px;
    outline: none;
    appearance: none;
  }

  .weather-select:focus {
    border-color: var(--c-weather);
  }
</style>
</head>

<body>

<header>
  <h1>electricity_db</h1>
  <span>day-ahead · actual load · weather</span>

  <div class="spacer"></div>

  <div class="rate-status">
    <div class="rate-item">
      <span class="rate-label">ENTSO-E</span>
      <span class="rate-value" id="entsoe-rate">—</span>
      <span>req/min</span>
    </div>

    <div class="rate-item">
      <span class="rate-label">COPERNICUS</span>
      <span class="rate-value" id="copernicus-rate">—</span>
      <span>req/min</span>
    </div>
  </div>

  <button class="btn" id="update-all-btn">↻ refresh all</button>
</header>

<div class="controls">
  <div class="field">
    <label>Zone</label>
    <select id="zone-select">
      {% for zone in zones %}
      <option value="{{ zone }}">{{ zone }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="field">
    <label>Start</label>
    <input type="datetime-local" id="start-input">
  </div>

  <div class="field">
    <label>End</label>
    <input type="datetime-local" id="end-input">
  </div>

  <button class="btn btn-fetch" id="fetch-btn">Fetch</button>
</div>

<div class="error-msg" id="error-msg"></div>

<div class="charts">

  <div class="chart-card">
    <div class="chart-header">
      <div class="chart-header-left">
        <span class="chart-title">Day-ahead price</span>
        <span class="chart-unit">EUR / MWh</span>
      </div>
      <button class="btn" id="sync-price-btn">↻ sync</button>
    </div>

    <div class="chart-container" id="price-chart">
      <div class="status">select a zone and date range</div>
    </div>
  </div>

  <div class="chart-card">
    <div class="chart-header">
      <div class="chart-header-left">
        <span class="chart-title">Actual total load</span>
        <span class="chart-unit">MW</span>
      </div>
      <button class="btn" id="sync-demand-btn">↻ sync</button>
    </div>

    <div class="chart-container" id="demand-chart">
      <div class="status">select a zone and date range</div>
    </div>
  </div>

  <div class="chart-card">
    <div class="chart-header">
      <div class="chart-header-left">
        <span class="chart-title">Weather</span>

        <select class="weather-select" id="weather-col">
          {% for col in weather_columns %}
          <option value="{{ col }}">{{ col }}</option>
          {% endfor %}
        </select>
      </div>

      <button class="btn" id="sync-weather-btn">↻ sync</button>
    </div>

    <div class="chart-container" id="weather-chart">
      <div class="status">select a zone and date range</div>
    </div>
  </div>

</div>

<script>
  const COLORS = {
    price: '#5DCAA5',
    demand: '#85B7EB',
    weather: '#C49EE0'
  };

  const layout = (unit) => ({
    paper_bgcolor: 'transparent',
    plot_bgcolor: 'transparent',
    font: {
      family: 'IBM Plex Mono, monospace',
      size: 11,
      color: '#666'
    },
    margin: {
      t: 10,
      r: 20,
      b: 40,
      l: 60
    },
    xaxis: {
      gridcolor: '#222',
      linecolor: '#2a2a2a',
      tickformat: '%d/%m/%y %H:%M',
      rangeslider: {
        visible: true,
        bgcolor: '#141414',
        bordercolor: '#2a2a2a',
        thickness: 0.08
      }
    },
    yaxis: {
      gridcolor: '#222',
      linecolor: '#2a2a2a',
      title: {
        text: unit,
        font: { size: 10 }
      }
    },
    showlegend: false
  });

  const config = {
    displayModeBar: false,
    responsive: true
  };

  function setDefaults() {
    const end = new Date();
    end.setMinutes(0, 0, 0);

    const start = new Date(end);
    start.setDate(start.getDate() - 7);

    document.getElementById('start-input').value =
      start.toISOString().slice(0, 16);

    document.getElementById('end-input').value =
      end.toISOString().slice(0, 16);
  }

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function clearError() {
    document.getElementById('error-msg').style.display = 'none';
  }

  function clearRates() {
    document.getElementById('entsoe-rate').textContent = '—';
    document.getElementById('copernicus-rate').textContent = '—';
  }

  function updateRates(status) {
    const entsoeRate = document.getElementById('entsoe-rate');
    const copernicusRate = document.getElementById('copernicus-rate');

    if (!status.rates) {
      clearRates();
      return;
    }

    entsoeRate.textContent =
      status.rates.entsoe ?? '—';

    copernicusRate.textContent =
      status.rates.copernicus ?? '—';
  }

  async function fetchData() {
    clearError();

    const zone = document.getElementById('zone-select').value;
    const start = document.getElementById('start-input').value;
    const end = document.getElementById('end-input').value;
    const col = document.getElementById('weather-col').value;
    const btn = document.getElementById('fetch-btn');

    if (!start || !end) {
      showError('please select a date range');
      return;
    }

    if (new Date(end) <= new Date(start)) {
      showError('end must be after start');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'loading...';

    const base = new URLSearchParams({
      zone,
      start: new Date(start).toISOString(),
      end: new Date(end).toISOString()
    });

    const weatherParams = new URLSearchParams(base);
    weatherParams.append('column', col);

    try {
      const [priceRes, demandRes, weatherRes] = await Promise.all([
        fetch(`/api/price?${base}`),
        fetch(`/api/demand?${base}`),
        fetch(`/api/weather?${weatherParams}`)
      ]);

      if (!priceRes.ok) {
        showError((await priceRes.json()).detail || 'price fetch failed');
        return;
      }

      if (!demandRes.ok) {
        showError((await demandRes.json()).detail || 'demand fetch failed');
        return;
      }

      if (!weatherRes.ok) {
        showError((await weatherRes.json()).detail || 'weather fetch failed');
        return;
      }

      const [priceData, demandData, weatherData] =
        await Promise.all([
          priceRes.json(),
          demandRes.json(),
          weatherRes.json()
        ]);

      const xMin = new Date(start).toISOString();
      const xMax = new Date(end).toISOString();

      const sharedRange = [xMin, xMax];

      const sharedLayout = (unit, range) => ({
        ...layout(unit),
        xaxis: {
          ...layout(unit).xaxis,
          range: range,
          autorange: false
        }
      });

      const trace = (data, xKey, yKey, color) => {
        const d = Array.isArray(data) ? data : [];

        return [{
          x: d.map(v => v[xKey]),
          y: d.map(v => v[yKey]),
          type: 'scatter',
          mode: 'lines',
          line: {
            color,
            width: 1.5
          }
        }];
      };

      Plotly.react(
        'price-chart',
        trace(priceData, 'timestamp', 'price', COLORS.price),
        sharedLayout('EUR/MWh', sharedRange),
        config
      );

      Plotly.react(
        'demand-chart',
        trace(demandData, 'timestamp', 'quantity', COLORS.demand),
        sharedLayout('MW', sharedRange),
        config
      );

      Plotly.react(
        'weather-chart',
        trace(weatherData, 'timestamp', 'value', COLORS.weather),
        sharedLayout(col, sharedRange),
        config
      );

    } finally {
      btn.disabled = false;
      btn.textContent = 'Fetch';
    }
  }

  document.getElementById('weather-col').addEventListener('change', () => {
    const zone = document.getElementById('zone-select').value;
    const start = document.getElementById('start-input').value;
    const end = document.getElementById('end-input').value;
    const col = document.getElementById('weather-col').value;

    if (!start || !end) return;

    const params = new URLSearchParams({
      zone,
      start: new Date(start).toISOString(),
      end: new Date(end).toISOString(),
      column: col
    });

    fetch(`/api/weather?${params}`)
      .then(r => r.json())
      .then(data => {
        Plotly.react(
          'weather-chart',
          [{
            x: data.map(d => d.timestamp),
            y: data.map(d => d.value),
            type: 'scatter',
            mode: 'lines',
            line: {
              color: COLORS.weather,
              width: 1.5
            }
          }],
          layout(col),
          config
        );
      });
  });

  const syncBtns = {
    entsoe_price: document.getElementById('sync-price-btn'),
    entsoe_demand: document.getElementById('sync-demand-btn'),
    copernicus: document.getElementById('sync-weather-btn'),
    all: document.getElementById('update-all-btn'),
  };

  let pollInterval = null;

  async function triggerFetch(source) {
    const key = source || 'all';
    const btn = syncBtns[key];

    const start = document.getElementById('start-input').value;
    const end = document.getElementById('end-input').value;

    clearRates();

    btn.disabled = true;
    btn.classList.add('running');
    btn.textContent = '↻ running...';

    try {
      const params = new URLSearchParams();

      if (source) {
        params.append('source', source);
      }

      if (start) {
        params.append(
          'start',
          new Date(start).toISOString()
        );
      }

      if (end) {
        params.append(
          'end',
          new Date(end).toISOString()
        );
      }

      const res = await fetch(
        `/api/fetch?${params}`,
        { method: 'POST' }
      );

      if (!res.ok) {
        showError(
          (await res.json()).detail || 'fetch failed'
        );

        btn.disabled = false;
        btn.classList.remove('running');
        btn.textContent =
          key === 'all' ? '↻ refresh all' : '↻ sync';

        return;
      }

      if (pollInterval) {
        clearInterval(pollInterval);
      }

      pollInterval = setInterval(async () => {
        try {
          const res = await fetch('/api/fetch/status');

          if (!res.ok) {
            return;
          }

          const status = await res.json();

          updateRates(status);

          const job = status[key];

          if (!job) {
            return;
          }

          if (
            job.status === 'done' ||
            job.status === 'failed'
          ) {
            clearInterval(pollInterval);
            pollInterval = null;

            clearRates();

            btn.disabled = false;
            btn.classList.remove('running');

            btn.textContent =
              key === 'all'
                ? '↻ refresh all'
                : '↻ sync';

            if (job.status === 'failed') {
              console.error(job.error);
              showError(job.error || 'fetch failed');
            }
          }

        } catch (e) {
          console.error('status polling failed:', e);
        }
      }, 2000);

    } catch (e) {
      showError('network error: ' + e.message);

      if (pollInterval) {
        clearInterval(pollInterval);
        pollInterval = null;
      }

      clearRates();

      btn.disabled = false;
      btn.classList.remove('running');

      btn.textContent =
        key === 'all'
          ? '↻ refresh all'
          : '↻ sync';
    }
  }

  document.getElementById('fetch-btn')
    .addEventListener('click', fetchData);

  document.getElementById('update-all-btn')
    .addEventListener(
      'click',
      () => triggerFetch(null)
    );

  document.getElementById('sync-price-btn')
    .addEventListener(
      'click',
      () => triggerFetch('entsoe_price')
    );

  document.getElementById('sync-demand-btn')
    .addEventListener(
      'click',
      () => triggerFetch('entsoe_demand')
    );

  document.getElementById('sync-weather-btn')
    .addEventListener(
      'click',
      () => triggerFetch('copernicus')
    );

  setDefaults();
</script>

</body>
</html>
