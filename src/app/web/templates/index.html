<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>electricity_db</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<header>
  <h1>electricity_db</h1>
  <span class="subtitle">sync overview</span>
  <div class="spacer"></div>
  <div class="rate-status">
    <div class="rate-item">
      <span class="rate-label">ENTSO-E</span>
      <span class="rate-value" id="entsoe-rate">—</span>
      <span>req/min</span>
    </div>
    <div class="rate-item">
      <span class="rate-label">COPERNICUS</span>
      <span class="rate-value" id="copernicus-rate">—</span>
      <span>req/min</span>
    </div>
  </div>
</header>

<nav class="pages">
  <a href="/" class="active">overview</a>
  <a href="/entsoe">entso-e</a>
  <a href="/copernicus">copernicus</a>
  <a href="/generation_units">generation units</a>
  <a href="/physical_flow">physical flow</a>
</nav>

<div class="error-msg" id="error-msg"></div>

<div class="charts" id="monitor-grid"></div>

<script>
  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function clearError() {
    document.getElementById('error-msg').style.display = 'none';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function renderProgress(progress) {
    if (!progress || Object.keys(progress).length === 0) {
      return `<div class="progress-list"><span>no activity yet</span></div>`;
    }
    const rows = Object.entries(progress).map(([zone, bySource]) => {
      const msgs = Object.entries(bySource)
        .map(([source, msg]) => `${escapeHtml(source)}: ${escapeHtml(msg)}`)
        .join(' · ');
      return `<div class="progress-zone"><span class="zone-label">${escapeHtml(zone)}</span><span>${msgs}</span></div>`;
    });
    return `<div class="progress-list">${rows.join('')}</div>`;
  }

  // Each card's DOM is built once (createCard) and mutated in place on
  // every subsequent poll (updateCard) -- the date inputs are part of the
  // one-time structure and are never touched again, so nothing can wipe
  // out what you're typing mid-interaction.
  const cardElements = {};
  let allCard = null;

  function createCard(sourceKey) {
    const card = document.createElement('div');
    card.className = 'chart-card';
    card.innerHTML = `
      <div class="chart-header">
        <div class="chart-header-left">
          <span class="chart-title">${escapeHtml(sourceKey)}</span>
        </div>
        <span class="status-badge idle" data-role="badge">idle</span>
      </div>

      <div class="card-controls">
        <div class="field">
          <label>Start</label>
          <input type="datetime-local" class="start-input">
        </div>
        <div class="field">
          <label>End</label>
          <input type="datetime-local" class="end-input">
        </div>
        <button class="btn" data-role="sync-btn">↻ sync</button>
      </div>

      <div data-role="error-slot"></div>
      <div data-role="progress-slot"></div>
    `;

    card.querySelector('[data-role="sync-btn"]').addEventListener('click', () => {
      const start = card.querySelector('.start-input').value;
      const end = card.querySelector('.end-input').value;
      triggerFetch(sourceKey, start, end);
    });

    return card;
  }

  function updateCard(card, data) {
    const status = data.status || 'idle';
    const isBusy = status === 'running' || status === 'queued';

    const badge = card.querySelector('[data-role="badge"]');
    badge.className = `status-badge ${status}`;
    badge.textContent = status;

    const btn = card.querySelector('[data-role="sync-btn"]');
    btn.disabled = isBusy;
    btn.className = `btn ${isBusy ? 'running' : ''}`;
    btn.textContent = isBusy ? '↻ running...' : '↻ sync';

    card.querySelector('[data-role="error-slot"]').innerHTML =
      (status === 'failed' && data.error) ? `<div class="source-error">${escapeHtml(data.error)}</div>` : '';

    card.querySelector('[data-role="progress-slot"]').innerHTML = renderProgress(data.progress);
  }

  // The 'all' card doesn't correspond to a single backend job -- clicking it
  // fans out into one /api/fetch call per real source. So instead of reading
  // one status-map entry like the other cards, it summarizes all of them.
  function createAllCard() {
    const card = document.createElement('div');
    card.className = 'chart-card';
    card.innerHTML = `
      <div class="chart-header">
        <div class="chart-header-left">
          <span class="chart-title">all</span>
        </div>
        <span class="status-badge idle" data-role="badge">idle</span>
      </div>

      <div class="card-controls">
        <div class="field">
          <label>Start</label>
          <input type="datetime-local" class="start-input">
        </div>
        <div class="field">
          <label>End</label>
          <input type="datetime-local" class="end-input">
        </div>
        <button class="btn" data-role="sync-btn">↻ sync all</button>
      </div>
    `;

    card.querySelector('[data-role="sync-btn"]').addEventListener('click', async () => {
      const start = card.querySelector('.start-input').value;
      const end = card.querySelector('.end-input').value;

      let payload;
      try {
        const res = await fetch('/api/fetch/status');
        payload = await res.json();
      } catch (e) {
        showError('network error: ' + e.message);
        return;
      }
      const { rates, ...statusMap } = payload;
      for (const sourceName of Object.keys(statusMap)) {
        triggerFetch(sourceName, start, end);
      }
    });

    return card;
  }

  function updateAllCard(card, statusMap) {
    const values = Object.values(statusMap);
    const busyCount = values.filter(v => v && (v.status === 'running' || v.status === 'queued')).length;

    const badge = card.querySelector('[data-role="badge"]');
    if (busyCount > 0) {
      badge.className = 'status-badge running';
      badge.textContent = `${busyCount}/${values.length} running`;
    } else {
      badge.className = 'status-badge idle';
      badge.textContent = 'idle';
    }
  }

  function updateRates(rates) {
    document.getElementById('entsoe-rate').textContent = rates?.entsoe ?? '—';
    document.getElementById('copernicus-rate').textContent = rates?.copernicus ?? '—';
  }

  function anyBusy(statusMap) {
    return Object.values(statusMap).some(v => v && (v.status === 'running' || v.status === 'queued'));
  }

  let pollTimer = null;

  async function refresh() {
    let payload;
    try {
      const res = await fetch('/api/fetch/status');
      payload = await res.json();
    } catch (e) {
      schedule(5000);
      return;
    }

    const { rates, ...statusMap } = payload;
    updateRates(rates);

    const grid = document.getElementById('monitor-grid');

    if (!allCard) {
      allCard = createAllCard();
      grid.appendChild(allCard);
    }

    for (const [key, data] of Object.entries(statusMap)) {
      let card = cardElements[key];
      if (!card) {
        card = createCard(key);
        cardElements[key] = card;
        grid.appendChild(card);
      }
      updateCard(card, data || {});
    }

    updateAllCard(allCard, statusMap);
    schedule(anyBusy(statusMap) ? 1500 : 5000);
  }

  function schedule(ms) {
    clearTimeout(pollTimer);
    pollTimer = setTimeout(refresh, ms);
  }

  async function triggerFetch(source, start, end) {
    clearError();
    try {
      const params = new URLSearchParams();
      params.append('source', source);
      if (start) params.append('start', new Date(start).toISOString());
      if (end) params.append('end', new Date(end).toISOString());
      const url = `/api/fetch?${params.toString()}`;

      const res = await fetch(url, { method: 'POST' });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        showError(body.detail || `request failed (${res.status})`);
        return;
      }
      schedule(0);
    } catch (e) {
      showError('network error: ' + e.message);
    }
  }

  refresh();
</script>

</body>
</html>
