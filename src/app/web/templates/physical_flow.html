<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>electricity_db · physical flow</title>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist@2.27.0/plotly.min.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<header>
  <h1>electricity_db</h1>
  <span class="subtitle">zone physical flow</span>

  <div class="spacer"></div>

  <div class="rate-status">
    <div class="rate-item">
      <span class="rate-label">ENTSO-E</span>
      <span class="rate-value" id="entsoe-rate">—</span>
      <span>req/min</span>
    </div>
  </div>
</header>

<nav class="pages">
  <a href="/">overview</a>
  <a href="/entsoe">entso-e</a>
  <a href="/copernicus">copernicus</a>
  <a href="/generation_units">generation units</a>
  <a href="/physical_flow" class="active">physical flow</a>
</nav>

<div class="controls">
  <div class="field field-fixed">
    <label>Zone</label>
    <select id="zone-select">
      {% for zone in zones %}
      <option value="{{ zone }}">{{ zone }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="field">
    <label>Start</label>
    <input type="datetime-local" id="start-input">
  </div>

  <div class="field">
    <label>End</label>
    <input type="datetime-local" id="end-input">
  </div>

  <button class="btn btn-fetch" id="fetch-btn">Fetch</button>
</div>

<div class="error-msg" id="error-msg"></div>

<div class="charts">

  <div class="chart-card">
    <div class="chart-header">
      <div class="chart-header-left">
        <span class="chart-title">Physical flow — export</span>
        <span class="chart-unit">MW</span>
      </div>
      <button class="btn" id="sync-export-btn">↻ sync</button>
    </div>

    <div class="chart-container" id="export-chart">
      <div class="status">select a zone and date range</div>
    </div>
  </div>

  <div class="chart-card">
    <div class="chart-header">
      <div class="chart-header-left">
        <span class="chart-title">Physical flow — import</span>
        <span class="chart-unit">MW</span>
      </div>
      <button class="btn" id="sync-import-btn">↻ sync</button>
    </div>

    <div class="chart-container" id="import-chart">
      <div class="status">select a zone and date range</div>
    </div>
  </div>

</div>

<script>
  // Every known directional link -- filtered client-side per selected zone.
  // Passed as a pre-serialized JSON string from the route (json.dumps), not
  // relying on a `tojson` Jinja filter that may not be registered.
  const LINKS = {{ links_json | safe }};

  // Palette for distinguishing multiple lines within one chart -- a different
  // concern from frontend-patterns.md's per-data-source accent colors, since
  // every line on these two charts is already the same data source (physical
  // flow); what needs distinguishing here is the counterpart zone.
  const PALETTE = ['#5DCAA5', '#85B7EB', '#E8A87C', '#C38DE0', '#F2D399', '#7FD1D1', '#E88DA8', '#A8D17F'];

  const layout = (unit) => ({
    paper_bgcolor: 'transparent',
    plot_bgcolor: 'transparent',
    font: {
      family: 'IBM Plex Mono, monospace',
      size: 11,
      color: '#666'
    },
    margin: {
      t: 10,
      r: 20,
      b: 40,
      l: 60
    },
    xaxis: {
      gridcolor: '#222',
      linecolor: '#2a2a2a',
      tickformat: '%d/%m/%y %H:%M',
      rangeslider: {
        visible: true,
        bgcolor: '#141414',
        bordercolor: '#2a2a2a',
        thickness: 0.08
      }
    },
    yaxis: {
      gridcolor: '#222',
      linecolor: '#2a2a2a',
      title: {
        text: unit,
        font: { size: 10 }
      }
    },
    showlegend: true,
    legend: {
      orientation: 'h',
      y: 1.2,
      font: { size: 10 }
    }
  });

  const config = {
    displayModeBar: false,
    responsive: true
  };

  function setDefaults() {
    const end = new Date();
    end.setMinutes(0, 0, 0);

    const start = new Date(end);
    start.setDate(start.getDate() - 7);

    document.getElementById('start-input').value =
      start.toISOString().slice(0, 16);

    document.getElementById('end-input').value =
      end.toISOString().slice(0, 16);
  }

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function clearError() {
    document.getElementById('error-msg').style.display = 'none';
  }

  function clearRates() {
    document.getElementById('entsoe-rate').textContent = '—';
  }

  function updateRates(status) {
    const entsoeRate = document.getElementById('entsoe-rate');

    if (!status.rates) {
      clearRates();
      return;
    }

    entsoeRate.textContent = status.rates.entsoe ?? '—';
  }

  // Exports: links where `zone` is the sender (origin). Imports: where it's the
  // receiver (destination). Matches LINKS' {origin, destination} shape.
  function exportsFor(zone) {
    return Object.entries(LINKS)
      .filter(([, v]) => v.origin === zone)
      .map(([key, v]) => ({ key, counterpart: v.destination }));
  }

  function importsFor(zone) {
    return Object.entries(LINKS)
      .filter(([, v]) => v.destination === zone)
      .map(([key, v]) => ({ key, counterpart: v.origin }));
  }

  // Fetches one link's series each, tolerating individual failures (one bad
  // link shouldn't blank out the whole chart) -- allSettled, not all.
  async function fetchLinks(links, start, end) {
    const base = new URLSearchParams({
      start: new Date(start).toISOString(),
      end: new Date(end).toISOString()
    });

    const results = await Promise.allSettled(
      links.map(async ({ key, counterpart }) => {
        const res = await fetch(`/api/physical_flow?link=${encodeURIComponent(key)}&${base}`);
        if (!res.ok) {
          throw new Error((await res.json()).detail || `${key} fetch failed`);
        }
        return { counterpart, data: await res.json() };
      })
    );

    const ok = [];
    const failed = [];
    for (const r of results) {
      if (r.status === 'fulfilled') ok.push(r.value);
      else failed.push(r.reason?.message || 'unknown error');
    }
    return { ok, failed };
  }

  function renderMultiTrace(containerId, series, unit, range) {
    const traces = series.map((s, i) => {
      const d = Array.isArray(s.data) ? s.data : [];
      return {
        x: d.map(v => v.timestamp),
        y: d.map(v => v.quantity),
        type: 'scatter',
        mode: 'lines',
        name: s.counterpart,
        line: {
          color: PALETTE[i % PALETTE.length],
          width: 1.5
        }
      };
    });

    Plotly.react(
      containerId,
      traces,
      {
        ...layout(unit),
        xaxis: { ...layout(unit).xaxis, range, autorange: false }
      },
      config
    );
  }

  async function fetchData() {
    clearError();

    const zone = document.getElementById('zone-select').value;
    const start = document.getElementById('start-input').value;
    const end = document.getElementById('end-input').value;
    const btn = document.getElementById('fetch-btn');

    if (!start || !end) {
      showError('please select a date range');
      return;
    }

    if (new Date(end) <= new Date(start)) {
      showError('end must be after start');
      return;
    }

    const exportLinks = exportsFor(zone);
    const importLinks = importsFor(zone);

    if (exportLinks.length === 0 && importLinks.length === 0) {
      showError(`no known links for ${zone}`);
      return;
    }

    btn.disabled = true;
    btn.textContent = 'loading...';

    const sharedRange = [new Date(start).toISOString(), new Date(end).toISOString()];

    try {
      const [exportResult, importResult] = await Promise.all([
        fetchLinks(exportLinks, start, end),
        fetchLinks(importLinks, start, end)
      ]);

      renderMultiTrace('export-chart', exportResult.ok, 'MW', sharedRange);
      renderMultiTrace('import-chart', importResult.ok, 'MW', sharedRange);

      const allFailed = [...exportResult.failed, ...importResult.failed];
      if (allFailed.length > 0) {
        showError(`${allFailed.length} link(s) failed to load: ${allFailed[0]}${allFailed.length > 1 ? ' (+' + (allFailed.length - 1) + ' more)' : ''}`);
      }

    } finally {
      btn.disabled = false;
      btn.textContent = 'Fetch';
    }
  }

  const syncBtns = {
    'export-chart': document.getElementById('sync-export-btn'),
    'import-chart': document.getElementById('sync-import-btn'),
  };

  let pollInterval = null;

  // Both buttons trigger the same underlying source -- there's one table
  // behind both charts, just viewed from two directions.
  async function triggerFetch(triggerKey) {
    const btn = syncBtns[triggerKey];
    const source = 'zone_physical_flow';

    const start = document.getElementById('start-input').value;
    const end = document.getElementById('end-input').value;

    clearRates();

    btn.disabled = true;
    btn.classList.add('running');
    btn.textContent = '↻ running...';

    try {
      const params = new URLSearchParams();
      params.append('source', source);

      if (start) {
        params.append('start', new Date(start).toISOString());
      }

      if (end) {
        params.append('end', new Date(end).toISOString());
      }

      const res = await fetch(`/api/fetch?${params}`, { method: 'POST' });

      if (!res.ok) {
        showError((await res.json()).detail || 'fetch failed');
        btn.disabled = false;
        btn.classList.remove('running');
        btn.textContent = '↻ sync';
        return;
      }

      if (pollInterval) {
        clearInterval(pollInterval);
      }

      pollInterval = setInterval(async () => {
        try {
          const res = await fetch('/api/fetch/status');
          if (!res.ok) return;

          const status = await res.json();
          updateRates(status);

          const job = status[source];
          if (!job) return;

          if (job.status === 'done' || job.status === 'failed') {
            clearInterval(pollInterval);
            pollInterval = null;

            clearRates();

            btn.disabled = false;
            btn.classList.remove('running');
            btn.textContent = '↻ sync';

            if (job.status === 'failed') {
              console.error(job.error);
              showError(job.error || 'fetch failed');
            }
          }
        } catch (e) {
          console.error('status polling failed:', e);
        }
      }, 2000);

    } catch (e) {
      showError('network error: ' + e.message);

      if (pollInterval) {
        clearInterval(pollInterval);
        pollInterval = null;
      }

      clearRates();

      btn.disabled = false;
      btn.classList.remove('running');
      btn.textContent = '↻ sync';
    }
  }

  document.getElementById('fetch-btn').addEventListener('click', fetchData);
  document.getElementById('sync-export-btn').addEventListener('click', () => triggerFetch('export-chart'));
  document.getElementById('sync-import-btn').addEventListener('click', () => triggerFetch('import-chart'));

  setDefaults();
</script>

</body>
</html>
